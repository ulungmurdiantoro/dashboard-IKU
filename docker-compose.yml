# docker-compose.yml -- Deployment Apache Superset + PostgreSQL
# Setup: salin .env.example jadi .env, isi semua nilai, lalu `docker compose up -d`
# Setelah jalan, buka http://localhost:8088 dan login pakai SUPERSET_ADMIN_USERNAME/PASSWORD dari .env

services:
  db:
    image: postgres:15
    container_name: superset_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5433:5432"

  superset:
    image: apache/superset:latest
    container_name: superset_app
    restart: unless-stopped
    user: root
    depends_on:
      - db
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py
    command: >
      sh -c "
      uv pip install --python /app/.venv/bin/python3 psycopg2-binary gunicorn &&
      superset db upgrade &&
      superset fab create-admin --username \"$$SUPERSET_ADMIN_USERNAME\" --firstname Admin --lastname User --email \"$$SUPERSET_ADMIN_EMAIL\" --password \"$$SUPERSET_ADMIN_PASSWORD\" &&
      superset init &&
      /app/.venv/bin/gunicorn --bind 0.0.0.0:8088 --workers 4 --worker-class gthread --threads 4 --timeout 120 'superset.app:create_app()'
      "

volumes:
  db_data:
  superset_home:

# =========================================================================
# LANGKAH SETELAH CONTAINER JALAN:
# 1. Import data dummy: jalankan generate_dummy_data.py, lalu load CSV
#    ke tabel yang sudah dibuat schema.sql (lewat psql \copy atau Superset
#    "Upload CSV" per tabel).
# 2. Di Superset: Settings > Database Connections > tambahkan koneksi ke
#    db (host: db, port: 5432, db: dashboard_iku, user: superset).
# 3. Buat Dataset per tabel di menu Datasets.
# 4. Set Row-Level Security: Settings > Row Level Security > buat rule
#    berbasis kolom faculty_id/program_id sesuai role login (lihat
#    blueprint.md bagian RBAC).
# =========================================================================
